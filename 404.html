<!doctype html>
<html lang="en-IN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Projectify Zone</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/main.css">
<script>
  try {
    var t = localStorage.getItem('pz-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
</head>
<body>
<main class="notfound">
  <div>
    <h1 class="gradient-text">404</h1>
    <p>This circuit isn't connected. The page you're looking for doesn't exist.</p>
    <a href="/" class="btn btn-primary btn-lg">Back to home <span aria-hidden="true">&rarr;</span></a>
  </div>
</main>
</body>
</html>
